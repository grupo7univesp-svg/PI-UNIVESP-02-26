<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lady's Pet - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <img src="{{ url_for('static', filename='img/Ladys.Pet.png') }}" alt="Logo Lady's Pet" class="logo-login">

        <h1>Lady's Pet</h1>

        <form action="{{ url_for('entrar') }}" method="POST">

            <div class="card">

                <!-- ID -->
                <div class="row g-3">

                    <input name="login" class="form-control" placeholder="ID" required>

                </div>


                <!-- SENHA -->
                <div class="row g-3">

                    <input name="senha" class="form-control" placeholder="Senha" required>

                </div>


                <!-- TIPO DE USUÁRIO -->
                <div class="row g-3">

                    <select name="tipo_usuario" class="form-control" required>

                        <option value="">
                            Selecione o tipo de usuário
                        </option>

                        <option value="adm">
                            Administrador
                        </option>

                        <option value="funcionario">
                            Funcionário
                        </option>

                    </select>

                </div>


                <!-- BOTÃO -->
                <button type="submit">
                    Entrar
                </button>


                <p id="mensagem"></p>

            </div>

        </form>

    </div>

</body>

</html>
