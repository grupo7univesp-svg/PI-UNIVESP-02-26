<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lady's Pet - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">

        <img src="{{ url_for('static', filename='img/Ladys.Pet.png') }}" alt="Logo Lady's Pet" class="logo-login">

        <h1>Lady's Pet</h1>

        <form action="{{ url_for('entrar') }}" method="POST">
            <div class="card">

                {% with mensagens = get_flashed_messages(with_categories=true) %}
                {% if mensagens %}
                {% for categoria, mensagem in mensagens %}
                <div class="alert alert-{{ categoria }} mb-3" role="alert">
                    {{ mensagem }}
                </div>
                {% endfor %}
                {% endif %}
                {% endwith %}

                <div class="row g-3">
                    <input type="text" name="login" class="form-control" placeholder="Usuário" autocomplete="username"
                        required>
                </div>

                <div class="row g-3 mt-1">
                    <div class="input-group">

                        <input type="password" name="senha" id="campoSenha" class="form-control" placeholder="Senha"
                            autocomplete="current-password" required>

                        <button type="button" class="btn btn-mostrar-senha" id="btnMostrarSenha"
                            aria-label="Mostrar senha" title="Mostrar senha">
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>
                </div>

                <button type="submit" class="mt-3">
                    Entrar
                </button>
            </div>
        </form>
    </div>
    <script>
        const campoSenha =
            document.getElementById("campoSenha");

        const btnMostrarSenha =
            document.getElementById("btnMostrarSenha");

        const iconeSenha =
            btnMostrarSenha.querySelector("i");

        btnMostrarSenha.addEventListener(
            "click",
            function () {

                const senhaVisivel =
                    campoSenha.type === "text";

                campoSenha.type =
                    senhaVisivel ? "password" : "text";

                iconeSenha.className =
                    senhaVisivel
                        ? "bi bi-eye"
                        : "bi bi-eye-slash";

                btnMostrarSenha.title =
                    senhaVisivel
                        ? "Mostrar senha"
                        : "Ocultar senha";

                btnMostrarSenha.setAttribute(
                    "aria-label",
                    senhaVisivel
                        ? "Mostrar senha"
                        : "Ocultar senha"
                );
            }
        );
    </script>
</body>

</html>
