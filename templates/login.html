<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

     <div class="container mt-5" style="width: 430px;">

        <h1>Meu Sistema</h1>
        <form>
        <div class="card shadow-sm border-1">
        <div class="row g-3">
        <input name="login" class="form-control" style="border-radius: 75px; height: 36px !important; font-size: 17px;" placeholder="ID" required>
        </div>
        <div class="row g-3">
        <input name="senha" class="form-control" style="border-radius: 75px; height: 36px !important; font-size: 17px;" placeholder="senha" required>
        </div>
        <button type="submit">
            Entrar
        </button>
        
        <p id="mensagem"></p>
        </form>
        </div>
    </div>


</body>
</html>
